<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lancer de dés</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #242424;
        color: #f9fafb;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { width: 100%; padding: 10px 24px 16px; text-align: center; }
      .label {
        font-size: 12px;
        font-weight: 700;
        color: #a5b4fc;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .formula { font-size: 13px; color: #9ca3af; margin-top: 4px; }
      .dice-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 6px; min-height: 40px; }
      .die {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #111827;
        border: 1px solid #374151;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        opacity: 0;
        animation: tumble 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      @keyframes tumble {
        0% { opacity: 0; transform: translateY(-20px) rotate(-200deg) scale(0.5); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }
      .total {
        font-size: 40px;
        font-weight: 800;
        line-height: 1.1;
        color: #a5b4fc;
        opacity: 0;
        transform: scale(0.5);
        animation: pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      @keyframes pop {
        to { opacity: 1; transform: scale(1); }
      }
      .hint { font-size: 10px; color: #6b7280; margin-top: 6px; }
      .error { color: #f87171; font-size: 13px; margin-top: 20px; }
      /* Max-value roll: gold flash */
      .die.crit {
        background: #92400e;
        border-color: #fbbf24;
        color: #fde68a;
        animation:
          tumble 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards,
          crit-glow 0.7s ease-in-out 3;
      }
      .total.crit {
        color: #fbbf24;
        animation:
          pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards,
          crit-text-glow 0.8s ease-in-out 3;
      }
      @keyframes crit-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        50% { box-shadow: 0 0 14px 4px rgba(251, 191, 36, 0.8); }
      }
      @keyframes crit-text-glow {
        0%, 100% { text-shadow: 0 0 0 rgba(251, 191, 36, 0); }
        50% { text-shadow: 0 0 16px rgba(251, 191, 36, 0.9); }
      }
      /* Natural 1: red flash */
      .die.fail {
        background: #7f1d1d;
        border-color: #f87171;
        color: #fecaca;
        animation:
          tumble 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards,
          fail-glow 0.7s ease-in-out 3;
      }
      .total.fail {
        color: #f87171;
        animation:
          pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards,
          fail-text-glow 0.8s ease-in-out 3;
      }
      @keyframes fail-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
        50% { box-shadow: 0 0 14px 4px rgba(248, 113, 113, 0.8); }
      }
      @keyframes fail-text-glow {
        0%, 100% { text-shadow: 0 0 0 rgba(248, 113, 113, 0); }
        50% { text-shadow: 0 0 16px rgba(248, 113, 113, 0.9); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label" id="label"></div>
      <div class="formula" id="formula"></div>
      <div class="dice-row" id="dice-row"></div>
      <div class="total" id="total"></div>
      <div class="hint">Clic à l'extérieur pour fermer</div>
    </div>
    <script type="module" src="/src/dice3d.js"></script>
  </body>
</html>
