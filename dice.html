<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lancer de dés</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #242424;
        color: #f9fafb;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { width: 100%; padding: 24px; text-align: center; }
      .label {
        font-size: 12px;
        font-weight: 700;
        color: #a5b4fc;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .formula { font-size: 13px; color: #9ca3af; margin-top: 4px; }
      .dice-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 8px; min-height: 46px; }
      .die {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #111827;
        border: 1px solid #374151;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        opacity: 0;
        animation: tumble 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      @keyframes tumble {
        0% { opacity: 0; transform: translateY(-20px) rotate(-200deg) scale(0.5); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }
      .total {
        font-size: 46px;
        font-weight: 800;
        line-height: 1.1;
        color: #a5b4fc;
        opacity: 0;
        transform: scale(0.5);
        animation: pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      @keyframes pop {
        to { opacity: 1; transform: scale(1); }
      }
      .hint { font-size: 10px; color: #6b7280; margin-top: 12px; }
      .error { color: #f87171; font-size: 13px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label" id="label"></div>
      <div class="formula" id="formula"></div>
      <div class="dice-row" id="dice-row"></div>
      <div class="total" id="total"></div>
      <div class="hint">Clic à l'extérieur pour fermer</div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const label = params.get('label') || 'Lancer de dés';
      const formula = params.get('formula') || '';
      const total = params.get('total');
      const rolls = (params.get('rolls') || '').split(',').filter(Boolean);
      const error = params.get('error');

      document.getElementById('label').textContent = label;
      const row = document.getElementById('dice-row');
      const totalEl = document.getElementById('total');

      if (error) {
        totalEl.style.display = 'none';
        const el = document.createElement('div');
        el.className = 'error';
        el.textContent = 'Formule invalide : ' + error;
        row.replaceWith(el);
      } else {
        document.getElementById('formula').textContent = formula;
        const shown = rolls.slice(0, 12);
        shown.forEach((r, i) => {
          const die = document.createElement('div');
          die.className = 'die';
          die.style.animationDelay = `${i * 0.08}s`;
          die.textContent = r;
          row.appendChild(die);
        });
        if (rolls.length > shown.length) {
          const more = document.createElement('div');
          more.className = 'die';
          more.style.animationDelay = `${shown.length * 0.08}s`;
          more.textContent = `+${rolls.length - shown.length}`;
          row.appendChild(more);
        }
        totalEl.style.animationDelay = `${0.45 + (shown.length + 1) * 0.08}s`;
        totalEl.textContent = total != null && total !== '' ? total : '—';
      }
    </script>
  </body>
</html>
