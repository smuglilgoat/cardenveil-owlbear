name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 260 JEST unit tests (reducer, deck, api, guards, sheet, attack, dice)
      - run: npm test

      # svelte-check (reference errors only) + production build of all 5 entries
      - run: npm run build
